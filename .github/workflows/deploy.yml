name: Deploy to Cloudflare Pages

# Chạy tự động mỗi khi push lên master — build với đúng biến môi trường lấy từ
# GitHub Secrets (không phụ thuộc Cloudflare Dashboard đọc đúng hay không, vốn
# là nguyên nhân production hay bị đè bằng placeholder URL). Không cần tắt
# Automatic Deployments của Cloudflare — workflow này luôn chạy sau và ghi đè
# lại bằng bản đúng, y hệt cơ chế thủ công trước đây nhưng giờ tự động.
on:
  push:
    branches: [master]
  workflow_dispatch: # cho phép bấm "Run workflow" thủ công trên GitHub nếu cần

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (Next.js static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=soi-chi --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
